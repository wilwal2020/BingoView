<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- bingo ball -->
  <circle cx="32" cy="32" r="30" fill="#202834"/>
  <circle cx="32" cy="32" r="29" fill="#F1B924"/>
  <!-- inner number disc -->
  <circle cx="32" cy="33" r="19" fill="#ffffff" stroke="#d9a91e" stroke-width="1.5"/>
  <!-- checkmark (mark off a called number) -->
  <path d="M23 33 l6.5 7 L43.5 24" fill="none" stroke="#202834"
        stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- glossy highlight -->
  <ellipse cx="22" cy="18" rx="9" ry="5" fill="#ffffff" opacity="0.35"/>
</svg>
