<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BingoView</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root {
  --ink:    #0a0a0a;
  --paper:  #f5f0e8;
  --cream:  #ede8dc;
  --gold:   #e8a020;
  --gold2:  #c47a10;
  --red:    #c8281e;
  --green:  #1a7a40;
  --dim:    #8a8070;
  --mono:   'IBM Plex Mono', monospace;
  --display:'Bebas Neue', sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  background: var(--ink);
  color: var(--paper);
  font-family: var(--mono);
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
}

/* ═══════════════════════════════════
   SHARED ELEMENTS
═══════════════════════════════════ */
.screen { display: none; flex-direction: column; flex: 1; }
.screen.active { display: flex; }

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 18px;
  border-bottom: 1px solid #222;
  background: #111;
  flex-shrink: 0;
}

.hdr-title {
  font-family: var(--display);
  font-size: 1.4rem;
  letter-spacing: 0.08em;
  color: var(--gold);
}

.conn-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: #333;
  transition: background 0.3s, box-shadow 0.3s;
  flex-shrink: 0;
}
.conn-dot.connected    { background: var(--green); box-shadow: 0 0 8px var(--green); }
.conn-dot.connecting   { background: var(--gold);  box-shadow: 0 0 8px var(--gold); animation: blink 1s infinite; }
.conn-dot.error        { background: var(--red);   box-shadow: 0 0 8px var(--red); }

@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

.conn-label {
  font-size: 0.65rem;
  color: var(--dim);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  display: flex;
  align-items: center;
  gap: 6px;
}

/* ═══════════════════════════════════
   PHONE SCREEN
═══════════════════════════════════ */
#screen-phone {
  overflow: hidden;
}

/* Code-entry connect screen */
#phone-connect {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 28px;
  padding: 24px;
}
.connect-header { text-align: center; }
.connect-title {
  font-family: var(--display);
  font-size: 2rem;
  color: var(--gold);
  letter-spacing: 0.06em;
  line-height: 1.1;
}
.connect-sub { font-size: 0.78rem; color: var(--dim); margin-top: 6px; }
.connect-form {
  display: flex;
  flex-direction: column;
  gap: 10px;
  width: 100%;
  max-width: 320px;
}
.phone-code-input {
  width: 100%;
  background: #161616;
  border: 1px solid #2a2a2a;
  border-radius: 8px;
  padding: 14px 16px;
  font-family: var(--mono);
  font-size: 1.4rem;
  font-weight: 600;
  color: var(--paper);
  letter-spacing: 0.18em;
  text-align: center;
  text-transform: uppercase;
  outline: none;
  transition: border-color 0.2s;
}
.phone-code-input:focus { border-color: var(--gold); }
.btn-phone-connect {
  font-family: var(--display);
  font-size: 1.3rem;
  letter-spacing: 0.06em;
  background: var(--gold);
  color: var(--ink);
  border: none;
  border-radius: 10px;
  padding: 14px;
  cursor: pointer;
  transition: background 0.15s;
}
.btn-phone-connect:hover { background: var(--gold2); }

#phone-body {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* Upload state */
#phone-upload {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px;
  gap: 20px;
}

.upload-zone {
  width: 100%;
  border: 2px dashed #333;
  border-radius: 14px;
  padding: 48px 24px;
  text-align: center;
  cursor: pointer;
  position: relative;
  transition: border-color 0.2s;
}

.upload-zone:active { border-color: var(--gold); }
.upload-zone input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.upload-zone .up-icon { font-size: 3rem; margin-bottom: 12px; }
.upload-zone h3 { font-family: var(--display); font-size: 1.6rem; color: var(--gold); letter-spacing: 0.06em; }
.upload-zone p { font-size: 0.72rem; color: var(--dim); margin-top: 6px; }

.apikey-row {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.apikey-label {
  font-size: 0.65rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--dim);
}

.apikey-input {
  width: 100%;
  background: #161616;
  border: 1px solid #2a2a2a;
  border-radius: 8px;
  padding: 11px 14px;
  font-family: var(--mono);
  font-size: 0.85rem;
  color: var(--paper);
  outline: none;
  transition: border-color 0.2s;
}

.apikey-input:focus { border-color: var(--gold); }

.apikey-hint {
  font-size: 0.62rem;
  color: #444;
  line-height: 1.4;
}

#phone-processing {
  display: none;
  flex: 1;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  padding: 24px;
}

.spinner {
  width: 48px; height: 48px;
  border: 3px solid #222;
  border-top-color: var(--gold);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.proc-label {
  font-size: 0.8rem;
  color: var(--dim);
  letter-spacing: 0.1em;
  text-align: center;
}

/* Pending / multi-photo queue screen */
#phone-pending {
  display: none;
  flex: 1;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 28px;
  padding: 24px;
}
.pending-header { text-align: center; }
.pending-title {
  font-family: var(--display);
  font-size: 2rem;
  color: var(--gold);
  letter-spacing: 0.06em;
  line-height: 1.1;
}
.pending-sub {
  font-size: 0.78rem;
  color: var(--dim);
  margin-top: 8px;
  line-height: 1.4;
}
.pending-buttons {
  display: flex;
  flex-direction: column;
  gap: 10px;
  width: 100%;
  max-width: 320px;
}
.pending-btn {
  font-family: var(--display);
  font-size: 1.2rem;
  letter-spacing: 0.06em;
  border: none;
  border-radius: 10px;
  padding: 14px 18px;
  cursor: pointer;
  transition: background 0.15s, opacity 0.15s;
}
.pending-btn-primary {
  background: var(--gold);
  color: var(--ink);
}
.pending-btn-primary:hover { background: var(--gold2); }
.pending-btn-primary:disabled {
  background: #3a311a;
  color: #665a3a;
  cursor: not-allowed;
}
.pending-btn-secondary {
  background: var(--green);
  color: #fff;
}
.pending-btn-secondary:hover { background: #13633a; }
.pending-btn-link {
  background: transparent;
  border: none;
  color: var(--dim);
  font-family: var(--mono);
  font-size: 0.78rem;
  cursor: pointer;
  padding: 8px;
}
.pending-btn-link:hover { color: var(--paper); }

/* Paper view */
#phone-paper {
  display: none;
  flex: 1;
  flex-direction: column;
  overflow: hidden;
}

#paper-canvas-wrap {
  flex: 1;
  overflow: auto;
  padding: 10px 8px;
  background: #1a1a1a;
}

/* Digitally reconstructed bingo paper */
#digital-paper {
  display: flex;
  flex-direction: column;
  gap: 4px;
  background: #fff;
  border: 1px solid #888;
  padding: 10px 8px;
  border-radius: 4px;
  max-width: 420px;
  margin: 0 auto;
  color: #111;
  font-family: var(--mono);
}

.strip {
  display: grid;
  grid-template-columns: 28px 1fr;
  border: 1.5px solid #222;
  border-radius: 3px;
  overflow: hidden;
  background: #fff;
}

.strip-id {
  display: flex;
  align-items: center;
  justify-content: center;
  background: #f0ede4;
  border-right: 1.5px solid #222;
  font-size: 0.7rem;
  font-weight: 700;
  color: #333;
  writing-mode: vertical-rl;
  transform: rotate(180deg);
}

.strip-grid {
  display: grid;
  grid-template-columns: repeat(9, 1fr);
  grid-template-rows: repeat(3, 1fr);
}

.cell {
  aspect-ratio: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  border-right: 1px solid #aaa;
  border-bottom: 1px solid #aaa;
  font-size: 1.05rem;
  font-weight: 700;
  color: #111;
  background: #fff;
  position: relative;
  transition: background 0.25s, color 0.25s;
}

.strip-grid > .cell:nth-child(9n) { border-right: none; }
.strip-grid > .cell:nth-last-child(-n+9) { border-bottom: none; }

.cell.called {
  background: rgba(200,40,30,0.16);
  color: var(--red);
}

.cell.latest {
  background: var(--red);
  color: #fff;
  box-shadow: 0 0 14px rgba(200,40,30,0.55);
  animation: cellPop 0.4s cubic-bezier(0.34,1.56,0.64,1);
  z-index: 2;
}

/* Proximity-to-win row highlights — applied to every cell in the row
   including blanks. Called / latest cells keep their normal red styling,
   so the highlight only tints the empty + uncalled cells. */
.cell.row-warm:not(.called):not(.latest) {
  background: rgba(232,160,32,0.24);
}
.cell.row-hot:not(.called):not(.latest) {
  background: rgba(232,160,32,0.44);
  color: #8a5500;
  animation: rowPulse 1.6s ease-in-out infinite;
}
.cell.row-winner:not(.called):not(.latest) {
  background: rgba(26,122,64,0.55);
  color: #fff;
  animation: rowWinPulse 1.1s ease-in-out infinite;
}

@keyframes rowPulse {
  0%,100% { box-shadow: inset 0 0 0 0 rgba(232,160,32,0); }
  50%     { box-shadow: inset 0 0 14px 2px rgba(232,160,32,0.55); }
}
@keyframes rowWinPulse {
  0%,100% { box-shadow: inset 0 0 6px 1px rgba(26,122,64,0.5); }
  50%     { box-shadow: inset 0 0 18px 3px rgba(26,122,64,0.9); }
}

/* Game tabs strip — row of 4 selectors */
.game-tabs {
  display: flex;
  gap: 4px;
  padding: 8px 10px;
  background: #0f0f0f;
  border-bottom: 1px solid #1e1e1e;
  flex-shrink: 0;
}

.game-tab {
  flex: 1;
  background: #161616;
  border: 1px solid #2a2a2a;
  border-radius: 8px;
  padding: 8px 6px;
  color: var(--dim);
  font-family: var(--mono);
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  cursor: pointer;
  position: relative;
  transition: background 0.15s, border-color 0.15s, color 0.15s;
}

.game-tab:hover { background: #1a1a1a; color: var(--paper); }

.game-tab.active {
  background: #201c12;
  border-color: var(--gold);
  color: var(--gold);
}

.game-tab.loaded::after {
  content: "";
  position: absolute;
  top: 4px; right: 6px;
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 6px var(--green);
}

@keyframes cellPop {
  0%   { transform: scale(0.6); }
  60%  { transform: scale(1.15); }
  100% { transform: scale(1); }
}

#phone-status-bar {
  padding: 10px 18px;
  background: #111;
  border-top: 1px solid #222;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}

.last-called {
  font-family: var(--display);
  font-size: 2rem;
  color: var(--red);
  letter-spacing: 0.06em;
  text-shadow: 0 0 16px rgba(200,40,30,0.5);
}

.last-called span {
  font-size: 0.65rem;
  font-family: var(--mono);
  color: var(--dim);
  display: block;
  text-transform: uppercase;
  letter-spacing: 0.12em;
}

.detected-count {
  font-size: 0.7rem;
  color: var(--dim);
  text-align: right;
}

/* Session code display */
#phone-code-display {
  padding: 12px 18px;
  background: #0d0d0d;
  border-top: 1px solid #1a1a1a;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}

.code-label { font-size: 0.65rem; color: var(--dim); text-transform: uppercase; letter-spacing: 0.1em; }
.code-value { font-size: 1.1rem; color: var(--gold); letter-spacing: 0.18em; font-weight: 600; }


/* Toast */
#toast {
  position: fixed;
  bottom: 20px; left: 50%;
  transform: translateX(-50%) translateY(60px);
  background: #222;
  border: 1px solid #333;
  border-radius: 8px;
  padding: 10px 18px;
  font-size: 0.8rem;
  transition: transform 0.25s ease;
  z-index: 999;
  white-space: nowrap;
  pointer-events: none;
}
#toast.show { transform: translateX(-50%) translateY(0); }
#toast.ok  { border-color: var(--green); color: var(--green); }
#toast.err { border-color: var(--red);   color: var(--red); }
#toast.warn{ border-color: var(--gold);  color: var(--gold); }

#btn-fresh-start {
  display: none;
  background: transparent;
  border: 1px solid #333;
  border-radius: 6px;
  color: var(--dim);
  font-family: var(--mono);
  font-size: 0.65rem;
  letter-spacing: 0.08em;
  padding: 5px 10px;
  cursor: pointer;
  text-transform: uppercase;
  transition: border-color 0.15s, color 0.15s;
}
#btn-fresh-start:hover { border-color: var(--red); color: var(--red); }
</style>
</head>
<body>

<!-- ══════════════════════════════════════
     PHONE SCREEN
══════════════════════════════════════ -->
<div id="screen-phone" class="screen active">
  <header>
    <div class="hdr-title">PHONE</div>
    <button id="btn-fresh-start">Nytt ark</button>
    <button id="btn-share-paper" style="display:none;background:transparent;border:1px solid #333;border-radius:6px;color:var(--dim);font-family:var(--mono);font-size:0.65rem;letter-spacing:0.08em;padding:5px 10px;cursor:pointer;text-transform:uppercase;" title="Del dette arket som lenke">Del ark</button>
    <div class="conn-label">
      <div class="conn-dot" id="phone-conn-dot"></div>
      <span id="phone-conn-label">Waiting</span>
    </div>
  </header>

  <!-- Game tabs — always visible after first upload -->
  <div id="game-tabs" class="game-tabs" style="display:none">
    <button class="game-tab" data-game="blue">Spill 1</button>
    <button class="game-tab" data-game="yellow">Spill 2</button>
    <button class="game-tab" data-game="pink">Spill 3</button>
    <button class="game-tab" data-game="grey">Spill 4</button>
  </div>

  <div id="phone-body">
    <!-- Step 0: Enter code from bingo site -->
    <div id="phone-connect">
      <div class="connect-header">
        <div class="connect-title">Skriv inn koden</div>
        <div class="connect-sub">Finn koden på bingo-siden</div>
      </div>
      <div class="connect-form">
        <input id="phone-code-input" class="phone-code-input"
               type="text" maxlength="6" placeholder="KODE HER"
               autocomplete="off" autocorrect="off" spellcheck="false"
               inputmode="text">
        <button id="btn-phone-connect" class="btn-phone-connect">Koble til</button>
      </div>
    </div>

    <!-- Step 1: Upload -->
    <div id="phone-upload">
      <div class="upload-zone">
        <input type="file" id="file-input" accept="image/*" capture="environment">
        <div class="up-icon">📄</div>
        <h3 id="upload-title">Scan Paper</h3>
        <p id="upload-sub">Tap to photograph the bingo paper for the active game</p>
      </div>
      <div class="apikey-row">
        <label class="apikey-label">Anthropic API Key</label>
        <input type="password" id="apikey-input" class="apikey-input"
               placeholder="sk-ant-..." autocomplete="off" spellcheck="false">
        <p class="apikey-hint">Stored locally, never sent anywhere except Anthropic</p>
      </div>
    </div>

    <!-- Step 2: Processing -->
    <div id="phone-processing">
      <div class="spinner"></div>
      <div class="proc-label" id="proc-label">Reading numbers…</div>
    </div>

    <!-- Step 2b: Multi-photo queue -->
    <div id="phone-pending">
      <div class="pending-header">
        <div class="pending-title">Bilde lagt til</div>
        <div id="pending-summary" class="pending-sub"></div>
      </div>
      <div class="pending-buttons">
        <button id="btn-take-next" class="pending-btn pending-btn-primary">Ta bilde for neste spill</button>
        <button id="btn-process-now" class="pending-btn pending-btn-secondary">Prosesser bildene</button>
        <button id="btn-pending-back" class="pending-btn-link">Avbryt</button>
      </div>
    </div>

    <!-- Step 3: Digital paper with highlights -->
    <div id="phone-paper">
      <div id="paper-canvas-wrap">
        <div id="digital-paper"></div>
      </div>
      <div id="phone-status-bar">
        <div class="last-called">
          <span id="phone-rekke-label">Rekke 1</span>
          <span id="phone-last-num">—</span>
        </div>
        <div class="detected-count" id="phone-detected-count"></div>
      </div>
      <div id="phone-code-display">
        <div>
          <div class="code-label">Tilkoblet sesjon</div>
          <div style="display:flex;align-items:center;gap:10px;">
            <div class="code-value" id="phone-code-value">——</div>
            <button id="btn-share-code" title="Del kode" style="display:none;background:transparent;border:1px solid #333;border-radius:6px;color:var(--dim);font-family:var(--mono);font-size:0.65rem;letter-spacing:0.06em;padding:4px 9px;cursor:pointer;text-transform:uppercase;">Del</button>
          </div>
        </div>
        <div class="conn-label">
          <div class="conn-dot" id="phone-conn-dot2"></div>
          <span id="phone-conn-label2">Tilkoblet</span>
        </div>
      </div>
    </div>
  </div>
</div>


<div id="toast"></div>

     JAVASCRIPT
══════════════════════════════════════ -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script>
'use strict';

// ════════════════════════════════════
// FIREBASE INIT
// ════════════════════════════════════
const firebaseConfig = {
  apiKey: "AIzaSyAmfLA07M4KSTnZJ8fF8VZ4Y96FLygv-Ps",
  authDomain: "bingoview-2b95c.firebaseapp.com",
  databaseURL: "https://bingoview-2b95c-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "bingoview-2b95c",
  storageBucket: "bingoview-2b95c.firebasestorage.app",
  messagingSenderId: "1010336105188",
  appId: "1:1010336105188:web:a28e58f68272150306e2f1"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
console.log('[BV] Firebase initialized');

// ════════════════════════════════════
// UTILITIES
// ════════════════════════════════════

function toast(msg, type = "", dur = 2500) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.className = "show " + type;
  clearTimeout(el._t);
  el._t = setTimeout(() => el.className = "", dur);
}

// ════════════════════════════════════
// SHARED CHANNEL STATE
// ════════════════════════════════════
let channelRef = null;


// ════════════════════════════════════
// PHONE MODE — 4 games
// ════════════════════════════════════

const GAMES = ['blue','yellow','pink','grey'];
const GAME_NAMES   = { blue:'Spill 1', yellow:'Spill 2', pink:'Spill 3', grey:'Spill 4' };
const GAME_COLORS  = { blue:'#2e6db4', yellow:'#d4a017', pink:'#c94f80', grey:'#7a7a7a' };

// Per-game state: strips (source data), DOM refs, called numbers, current rekke
const gameState = {};
GAMES.forEach(g => gameState[g] = {
  strips: null,         // parsed strips array from Claude
  paperEl: null,        // rendered digital paper DOM element
  cellMap: {},          // { "42": <div.cell> } for this game
  called: [],           // ordered list of called numbers
  rekke: 'Rekke1',      // which rekke is active for this game
});

let activeGame = 'blue';          // currently displayed game on phone
let currentGame = null;           // the game the main site (iPad) is on
let currentRekke = 'Rekke1';      // the rekke the main site is on
let latestCell = null;            // last "latest"-highlighted cell in the active game
const pendingPhotos = {};         // gameKey → File queued for processing
let resetTs = 0;                  // callLog entries with ts ≤ resetTs are ignored (pre-reset)
let sessionCode = null;           // code used to connect — key for localStorage

// ── Session persistence ───────────────────────────────────────
function saveSession() {
  if (!sessionCode) return;
  const data = {};
  GAMES.forEach(g => {
    data[g] = { strips: gameState[g].strips, called: gameState[g].called, rekke: gameState[g].rekke };
  });
  try { localStorage.setItem('bv_paper_' + sessionCode, JSON.stringify(data)); } catch(e) {}
}

function restoreSession() {
  if (!sessionCode) return false;
  let raw;
  try { raw = localStorage.getItem('bv_paper_' + sessionCode); } catch(e) { return false; }
  if (!raw) return false;
  const saved = JSON.parse(raw);
  let any = false;
  GAMES.forEach(g => {
    if (!saved[g] || !saved[g].strips) return;
    gameState[g].strips = saved[g].strips;
    gameState[g].called = saved[g].called || [];
    gameState[g].rekke  = saved[g].rekke  || 'Rekke1';
    buildPaperForGame(g);
    gameState[g].called.forEach((n, i) =>
      applyCallToGame(g, n, i === gameState[g].called.length - 1)
    );
    any = true;
  });
  return any;
}

function clearSession() {
  if (!sessionCode) return;
  try { localStorage.removeItem('bv_paper_' + sessionCode); } catch(e) {}
}

function initPhone() {
  // Show the code-entry screen first
  document.getElementById("phone-connect").style.display = "flex";
  document.getElementById("phone-upload").style.display  = "none";

  // Connect button
  document.getElementById("btn-phone-connect").addEventListener("click", () => {
    const code = document.getElementById("phone-code-input").value.trim().toUpperCase();
    if (code.length < 4) { toast("Skriv inn koden fra bingo-siden", "warn"); return; }
    connectPhone(code);
  });
  document.getElementById("phone-code-input").addEventListener("keydown", e => {
    if (e.key === "Enter") document.getElementById("btn-phone-connect").click();
  });

  // File upload — queue photo for active game, then show pending screen
  document.getElementById("file-input").addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (!file) return;
    pendingPhotos[activeGame] = file;
    e.target.value = "";
    showPendingScreen();
  });

  document.getElementById("btn-take-next").addEventListener("click", () => {
    const nextEmpty = GAMES.find(g => !gameState[g].strips && !pendingPhotos[g]);
    if (!nextEmpty) return;
    activeGame = nextEmpty;
    refreshGameTabs();
    updateUploadTitle();
    document.getElementById("phone-pending").style.display = "none";
    document.getElementById("phone-upload").style.display = "flex";
    setTimeout(() => document.getElementById("file-input").click(), 120);
  });

  document.getElementById("btn-process-now").addEventListener("click", async () => {
    await processAllPending();
  });

  document.getElementById("btn-pending-back").addEventListener("click", () => {
    document.getElementById("phone-pending").style.display = "none";
    const gs = gameState[activeGame];
    if (gs.paperEl) {
      document.getElementById("phone-paper").style.display = "flex";
    } else {
      document.getElementById("phone-upload").style.display = "flex";
    }
  });

  // Share session code button
  document.getElementById("btn-share-code").addEventListener("click", async () => {
    if (!sessionCode) return;
    try {
      if (navigator.share) {
        await navigator.share({ title: 'BingoView', text: `BingoView-kode: ${sessionCode}` });
      } else {
        await navigator.clipboard.writeText(sessionCode);
        toast('Kode kopiert!', 'ok', 2000);
      }
    } catch(e) {}
  });

  // Share paper button — encodes active game's strips as a URL the recipient opens
  document.getElementById("btn-share-paper").addEventListener("click", async () => {
    const strips = gameState[activeGame].strips;
    if (!strips) return;
    try {
      const encoded = btoa(JSON.stringify(strips));
      const url = location.origin + location.pathname + '?import=' + encodeURIComponent(encoded);
      if (navigator.share) {
        await navigator.share({ title: 'Bingo-ark', text: 'Ditt bingo-ark:', url });
      } else {
        await navigator.clipboard.writeText(url);
        toast('Lenke kopiert!', 'ok', 2000);
      }
    } catch(e) {}
  });

  // Import paper from URL — recipient opens a shared link and gets the strips pre-loaded
  const importParam = new URLSearchParams(location.search).get('import');
  if (importParam) {
    try {
      const strips = JSON.parse(atob(decodeURIComponent(importParam)));
      if (Array.isArray(strips)) {
        gameState[activeGame].strips = strips;
        buildPaperForGame(activeGame);
        showGameTabs();
        toast('Ark importert — skriv inn koden for å motta tall', 'ok', 5000);
      }
    } catch(e) {}
    history.replaceState(null, '', location.pathname);
  }

  // Fresh-start button — two-tap confirm to avoid accidental resets
  const freshBtn = document.getElementById("btn-fresh-start");
  let freshConfirmTimeout = null;
  freshBtn.addEventListener("click", () => {
    if (freshBtn.dataset.confirming !== "1") {
      // First tap — ask for confirmation
      freshBtn.dataset.confirming = "1";
      freshBtn.textContent = "Bekreft?";
      freshBtn.style.borderColor = "var(--red)";
      freshBtn.style.color       = "var(--red)";
      freshConfirmTimeout = setTimeout(() => {
        freshBtn.dataset.confirming = "";
        freshBtn.textContent = "Nytt ark";
        freshBtn.style.borderColor = "";
        freshBtn.style.color       = "";
      }, 3000);
    } else {
      // Second tap — confirmed
      clearTimeout(freshConfirmTimeout);
      freshBtn.dataset.confirming = "";
      freshBtn.textContent = "Nytt ark";
      freshBtn.style.borderColor = "";
      freshBtn.style.color       = "";
      clearSession();
      GAMES.forEach(g => {
        gameState[g].strips = null;
        gameState[g].paperEl = null;
        gameState[g].cellMap = {};
        gameState[g].called  = [];
        gameState[g].rekke   = 'Rekke1';
      });
      activeGame = 'blue';
      latestCell = null;
      Object.keys(pendingPhotos).forEach(k => delete pendingPhotos[k]);
      document.getElementById("phone-pending").style.display = "none";
      document.getElementById("phone-paper").style.display   = "none";
      document.getElementById("phone-upload").style.display  = "flex";
      refreshGameTabs();
      updateUploadTitle();
      toast("Nytt ark klart", "ok", 2000);
    }
  });

  // Game tab clicks
  document.querySelectorAll('.game-tab').forEach(btn => {
    btn.addEventListener('click', () => selectActiveGame(btn.dataset.game));
  });

  // Restore saved API key and last session code
  const savedKey = localStorage.getItem("bv_apikey");
  if (savedKey) document.getElementById("apikey-input").value = savedKey;
  const lastCode = localStorage.getItem("bv_last_code");
  if (lastCode) document.getElementById("phone-code-input").value = lastCode;

  refreshGameTabs();
  updateUploadTitle();
}

function connectPhone(code) {
  sessionCode = code;
  try { localStorage.setItem('bv_last_code', code); } catch(e) {}
  channelRef = db.ref('bingoview/' + code);
  console.log('[BV phone] connecting to bingoview/' + code);

  // Register presence — Firebase removes it automatically on disconnect
  const phoneId = Math.random().toString(36).slice(2, 8).toUpperCase();
  const presenceRef = channelRef.child('phones/' + phoneId);
  presenceRef.set({ ts: Date.now() });
  presenceRef.onDisconnect().remove();

  // Update UI
  setConnStatus("connecting", "Kobler til\u2026");
  document.getElementById("phone-code-value").textContent = code;
  document.getElementById("phone-connect").style.display = "none";
  document.getElementById("btn-fresh-start").style.display = "block";
  document.getElementById("btn-share-code").style.display  = "block";

  // Restore any saved paper data for this session
  const restored = restoreSession();
  if (restored) {
    showGameTabs();
    renderActiveGame();
    toast("Ark gjenopprettet", "ok", 3000);
  } else {
    document.getElementById("phone-upload").style.display = "flex";
  }
  refreshGameTabs();
  updateUploadTitle();

  // Mark connected once Firebase confirms the write
  presenceRef.once('value', () => setConnStatus("connected", "Tilkoblet \u2713"));

  // Called numbers — replay any missed while backgrounded
  channelRef.child('resetTs').once('value', (snap) => {
    resetTs = snap.val() || 0;
    channelRef.child('callLog').on('child_added', (snap) => {
      const data = snap.val();
      if (!data || !data.number || !data.ts) return;
      if (data.ts <= resetTs) return;
      handleCalledNumber(data.number, data.game, data.rekke);
    });
  });

  // Game/rekke state from main site
  channelRef.child('state').on('value', (snap) => {
    const data = snap.val();
    if (!data) return;
    applyRemoteState(data.game, data.rekke);
  });

  // Reset events — ignore stale events that predate this connection
  const connectedAt = Date.now();
  channelRef.child('reset').on('value', (snap) => {
    const data = snap.val();
    if (!data || !data.ts) return;
    if (data.ts < connectedAt) return;
    handleRemoteReset(data.scope, data.game);
  });
}

function setConnStatus(state, label) {
  ["phone-conn-dot", "phone-conn-dot2"].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.className = "conn-dot " + state;
  });
  ["phone-conn-label", "phone-conn-label2"].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.textContent = label;
  });
}

async function processImage(file) {
  document.getElementById("phone-pending").style.display    = "none";
  document.getElementById("phone-upload").style.display     = "none";
  document.getElementById("phone-processing").style.display = "flex";
  const setLabel = t => document.getElementById("proc-label").textContent = t;

  // Load and save API key
  const keyInput = document.getElementById("apikey-input");
  const apiKey = keyInput.value.trim() || localStorage.getItem("bv_apikey") || "";
  if (!apiKey) {
    document.getElementById("phone-upload").style.display = "flex";
    document.getElementById("phone-processing").style.display = "none";
    toast("Enter your Anthropic API key first", "err", 4000);
    return;
  }
  localStorage.setItem("bv_apikey", apiKey);

  try {
    // Resize image for API — max 1600px on longest side to keep tokens low
    setLabel("Preparing image…");
    const bitmap = await createImageBitmap(file);
    const MAX = 1600;
    let sendCanvas = document.createElement("canvas");
    const scale = Math.min(1, MAX / Math.max(bitmap.width, bitmap.height));
    sendCanvas.width  = Math.round(bitmap.width  * scale);
    sendCanvas.height = Math.round(bitmap.height * scale);
    sendCanvas.getContext("2d").drawImage(bitmap, 0, 0, sendCanvas.width, sendCanvas.height);

    // Convert to base64 JPEG
    const b64 = sendCanvas.toDataURL("image/jpeg", 0.92).split(",")[1];

    setLabel("Sending to Claude…");

    const prompt = `This is a Norwegian 90-ball bingo ticket (bingoark). It has 6 strips stacked vertically, each identified by a 4-digit number printed in the left margin (e.g. "4201"). Each strip is a 3-row × 9-column grid holding exactly 15 numbers (5 per row); the other 12 cells are blank.

Return a JSON array of exactly 6 strip objects in top-to-bottom order. Each object must have:
- "id": the 4-digit strip identifier as a string
- "rows": array of exactly 3 subarrays (row 0 = top row, row 2 = bottom row). Each subarray contains the 5 numbers that appear in that row, in any order.

Output raw JSON only — no prose, no markdown fences.

Example:
[{"id":"4201","rows":[[11,27,41,70,87],[9,24,37,53,63],[2,36,55,65,74]]},{"id":"4202","rows":[[14,22,34,42,86],[3,12,32,59,60],[26,46,68,77,89]]}, ...]`;

    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-api-key": apiKey,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true"
      },
      body: JSON.stringify({
        model: "claude-opus-4-5",
        max_tokens: 3000,
        messages: [{
          role: "user",
          content: [
            { type: "image", source: { type: "base64", media_type: "image/jpeg", data: b64 } },
            { type: "text",  text: prompt }
          ]
        }]
      })
    });

    if (!response.ok) {
      const err = await response.json().catch(() => ({}));
      throw new Error(err?.error?.message || `API error ${response.status}`);
    }

    setLabel("Parsing result…");
    const data = await response.json();
    const raw  = data.content.find(b => b.type === "text")?.text || "";

    // Strip any accidental markdown fences
    const clean = raw.replace(/```json|```/g, "").trim();
    const parsed = JSON.parse(clean);
    if (!Array.isArray(parsed)) throw new Error("Expected array of strips");

    // Render into the active game slot
    const gs = gameState[activeGame];
    gs.strips = parsed;
    buildPaperForGame(activeGame);
    const count = Object.keys(gs.cellMap).length;

    // Replay any already-called numbers for this game onto the new paper
    gs.called.forEach((n, i) => applyCallToGame(activeGame, n, i === gs.called.length - 1));

    saveSession();
    showGameTabs();
    renderActiveGame();
    document.getElementById("phone-processing").style.display = "none";
    document.getElementById("phone-detected-count").textContent = `${count}/90 detected`;

    toast(count >= 85
      ? `✓ ${count} numbers found`
      : `⚠ Only ${count} found — try rescanning`,
      count >= 85 ? "ok" : "warn", 4000);

  } catch(err) {
    console.error(err);
    document.getElementById("phone-processing").style.display = "none";
    document.getElementById("phone-upload").style.display = "flex";
    setLabel("Error — try again");
    toast("Error: " + err.message, "err", 5000);
  }
}

// Build (or rebuild) the paper DOM for one game from its strips data.
function buildPaperForGame(gameKey) {
  const gs = gameState[gameKey];
  if (!gs.strips) return;

  const paper = document.createElement("div");
  paper.className = "digital-paper-inner";
  paper.style.cssText = "display:flex;flex-direction:column;gap:4px;";
  gs.cellMap = {};

  const colForNumber = n => Math.min(Math.floor(n / 10), 8);

  for (const strip of gs.strips) {
    if (!strip || !Array.isArray(strip.rows)) continue;

    const grid = Array.from({length: 3}, () => Array(9).fill(null));
    for (let row = 0; row < 3; row++) {
      const nums = strip.rows[row] || [];
      for (const n of nums) {
        const num = Number(n);
        if (!Number.isInteger(num) || num < 1 || num > 90) continue;
        grid[row][col_safe(num, colForNumber)] = num;
      }
    }

    const stripEl = document.createElement("div");
    stripEl.className = "strip";
    stripEl._rows    = [[], [], []];   // ALL 9 cells per row (for highlight classes)
    stripEl._numRows = [[], [], []];   // only number-containing cells (for missing count)

    const idEl = document.createElement("div");
    idEl.className = "strip-id";
    idEl.textContent = strip.id || "";
    stripEl.appendChild(idEl);

    const gridEl = document.createElement("div");
    gridEl.className = "strip-grid";

    for (let row = 0; row < 3; row++) {
      for (let col = 0; col < 9; col++) {
        const cell = document.createElement("div");
        cell.className = "cell";
        const num = grid[row][col];
        if (num !== null) {
          cell.textContent = num;
          cell.dataset.num = num;
          cell.dataset.row = row;
          gs.cellMap[String(num)] = cell;
          stripEl._numRows[row].push(cell);
        }
        stripEl._rows[row].push(cell);   // always — all 9 cells
        gridEl.appendChild(cell);
      }
    }

    stripEl.appendChild(gridEl);
    paper.appendChild(stripEl);
  }

  gs.paperEl = paper;
}

function col_safe(num, fn) {
  const c = fn(num);
  return c < 0 ? 0 : (c > 8 ? 8 : c);
}

// Put the currently active game's paper into view
function renderActiveGame() {
  const gs = gameState[activeGame];
  const wrap = document.getElementById("digital-paper");
  wrap.innerHTML = "";
  const gameColor = GAME_COLORS[activeGame] || '#fff';
  wrap.style.background   = gameColor;
  wrap.style.borderColor  = gameColor;
  document.getElementById("phone-pending").style.display = "none";

  if (gs.paperEl) {
    wrap.appendChild(gs.paperEl);
    document.getElementById("phone-upload").style.display = "none";
    document.getElementById("phone-paper").style.display = "flex";
    document.getElementById("btn-share-paper").style.display = "block";

    const count = Object.keys(gs.cellMap).length;
    document.getElementById("phone-detected-count").textContent = count ? `${count}/90 detected` : "";

    // Restore latest highlight for this game
    latestCell = null;
    if (gs.called.length) {
      const last = gs.called[gs.called.length - 1];
      const cell = gs.cellMap[String(last)];
      if (cell) {
        cell.classList.remove("called");
        cell.classList.add("latest");
        latestCell = cell;
      }
      document.getElementById("phone-last-num").textContent = last;
    } else {
      document.getElementById("phone-last-num").textContent = "—";
    }

    updateProximityHighlights(activeGame);
  } else {
    document.getElementById("phone-paper").style.display  = "none";
    document.getElementById("phone-upload").style.display = "flex";
    document.getElementById("btn-share-paper").style.display = "none";
  }

  updateRekkeLabel();
  refreshGameTabs();
  updateUploadTitle();
}

function showGameTabs() {
  document.getElementById("game-tabs").style.display = "flex";
}

function refreshGameTabs() {
  const tabsWrap = document.getElementById("game-tabs");
  const anyLoaded = GAMES.some(g => gameState[g].strips);
  tabsWrap.style.display = anyLoaded ? "flex" : "none";

  document.querySelectorAll(".game-tab").forEach(btn => {
    const g = btn.dataset.game;
    btn.classList.toggle("active", g === activeGame);
    btn.classList.toggle("loaded", !!gameState[g].strips);
    // Suffix game name with "✓" if loaded, "●" mark if this is the main-site current game
    const marker = (g === currentGame) ? " •" : "";
    btn.textContent = GAME_NAMES[g] + marker;
  });
}

function selectActiveGame(game) {
  if (!GAMES.includes(game)) return;

  renderActiveGame();
}

  const title = document.getElementById("upload-title");

async function processAllPending() {
  const entries = Object.entries(pendingPhotos);
  if (!entries.length) return;
  for (const [gameKey, file] of entries) {
    activeGame = gameKey;
    refreshGameTabs();
    delete pendingPhotos[gameKey];

function updateRekkeLabel() {
  const gs = gameState[activeGame];
  const el = document.getElementById("phone-rekke-label");
  if (el) el.textContent = gs.rekke.replace("Rekke","Rekke ");
}

// Apply a called number to a given game's state — updates DOM if that game is active
function applyCallToGame(gameKey, number, isLatestEver) {
  const gs = gameState[gameKey];
  if (!gs.cellMap) return;
  const cell = gs.cellMap[String(number)];
  if (!cell) return;
  if (gameKey === activeGame) {
    cell.classList.remove("latest");
    cell.classList.add("called");
    if (isLatestEver) {
      if (latestCell && latestCell !== cell) {
        latestCell.classList.remove("latest");
        latestCell.classList.add("called");
      }
      cell.classList.remove("called");
      cell.classList.add("latest");
      latestCell = cell;
    }
  }
}

function handleCalledNumber(number, game, rekke) {
  // Route to the right game bucket. If no game specified, apply to the main-site current game or the active one.
  const target = (game && GAMES.includes(game)) ? game : (currentGame || activeGame);

  // Update rekke for that game if provided
  if (rekke && /^Rekke[1-3]$/.test(rekke)) {
    gameState[target].rekke = rekke;
    if (target === (currentGame || activeGame)) currentRekke = rekke;
  }

  // Record call (avoid duplicates from rehydration)
  const called = gameState[target].called;
  if (called[called.length - 1] !== number) called.push(number);

  if (target === activeGame) {
    document.getElementById("phone-last-num").textContent = number;

    // Demote previous latest
    if (latestCell) {
      latestCell.classList.remove("latest");
      latestCell.classList.add("called");
    }
    const cell = gameState[activeGame].cellMap[String(number)];
    if (cell) {
      cell.classList.remove("called");
      cell.classList.add("latest");
      latestCell = cell;
    } else if (gameState[activeGame].strips) {
      toast(`#${number} not on this paper`, "warn");
    }

    updateProximityHighlights(activeGame);
    updateRekkeLabel();

    // Brief screen flash (no scroll!)
    document.body.style.transition = "background 0.05s";
    document.body.style.background = "rgba(200,40,30,0.15)";
    setTimeout(() => document.body.style.background = "var(--ink)", 150);
  } else {
    updateProximityHighlights(target);
  }
  saveSession();
}

function applyRemoteState(game, rekke) {
  let changed = false;
  if (game && GAMES.includes(game)) {
    currentGame = game;
    // auto-follow: if user hasn't pinned a different game, switch view
    if (activeGame !== game && gameState[game].strips) {
      activeGame = game;
      changed = true;
    }
  }
  if (rekke && /^Rekke[1-3]$/.test(rekke)) {
    currentRekke = rekke;
    const tgt = currentGame || activeGame;
    gameState[tgt].rekke = rekke;
    changed = true;
  }
  const pendingVisible = document.getElementById("phone-pending").style.display === "flex";
  if (changed && !pendingVisible) renderActiveGame();
  else { refreshGameTabs(); updateRekkeLabel(); updateProximityHighlights(activeGame); }
}

function handleRemoteReset(scope, game) {
  resetTs = Date.now();
  if (scope === 'all') {
    GAMES.forEach(g => {
      gameState[g].called = [];
      gameState[g].rekke = 'Rekke1';
      if (gameState[g].strips) buildPaperForGame(g);
    });
    toast("Alle spill nullstilt", "warn");
  } else if (scope === 'game' && game && GAMES.includes(game)) {
    gameState[game].called = [];
    gameState[game].rekke = 'Rekke1';
    if (gameState[game].strips) buildPaperForGame(game);
    toast(`${GAME_NAMES[game]} nullstilt`, "warn");
  }
  saveSession();
  renderActiveGame();
}

// ─── Proximity-to-win highlighting ───────────────────────────
// For each strip in the given game: compute how many numbers per row are
// still missing, then highlight the rows that form the win path for the
// active rekke (Rekke1 → 1 row, Rekke2 → 2 rows, Rekke3 → 3 rows).
// Start highlighting at ≤2 missing (Rekke1) or ≤3 missing (Rekke2/3).
function updateProximityHighlights(gameKey) {
  const gs = gameState[gameKey];
  if (!gs.paperEl) return;
  const calledSet = new Set(gs.called.map(String));
  const rekke = gs.rekke || 'Rekke1';
  const rowsNeeded = rekke === 'Rekke1' ? 1 : (rekke === 'Rekke2' ? 2 : 3);
  // missing threshold to START warming
  const warmThreshold = rekke === 'Rekke1' ? 2 : 3;

  gs.paperEl.querySelectorAll(".strip").forEach(stripEl => {
    const rowArr  = stripEl._rows    || [];   // all 9 cells per row
    const numRows = stripEl._numRows || [];   // only number cells per row

    // Compute missing count using only number cells
    const missingPerRow = numRows.map(cells =>
      cells.reduce((acc, c) => acc + (calledSet.has(c.dataset.num) ? 0 : 1), 0)
    );

    // Sort rows by missing ascending, pick top N=rowsNeeded
    const rowsWithIdx = missingPerRow.map((m, idx) => ({ m, idx }))
                                     .sort((a, b) => a.m - b.m);
    const selected = rowsWithIdx.slice(0, rowsNeeded);
    const totalMissing = selected.reduce((s, r) => s + r.m, 0);

    // Clear previous highlights from ALL cells in all rows
    rowArr.forEach(cells => cells.forEach(c => {
      c.classList.remove("row-warm", "row-hot", "row-winner");
    }));

    if (totalMissing > warmThreshold) return;

    // Intensity: 0 missing = winner; 1 missing = hot; anything else on threshold = warm
    let cls;
    if (totalMissing === 0)      cls = "row-winner";
    else if (totalMissing === 1) cls = "row-hot";
    else                         cls = "row-warm";

    // Apply to ALL 9 cells in each selected row (including blanks)
    selected.forEach(({ idx }) => {
      rowArr[idx].forEach(c => c.classList.add(cls));
    });
  });
}


initPhone();
</script>
